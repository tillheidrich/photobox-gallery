[pytest]
testpaths = tests
# All three suites read this file (booth/ and sync/ have none of their own).
# pytest keeps the tmp_path folders of the last three runs by default; on a
# machine that runs the suites all day they added up. Keep none: the run's
# folder (tools/tmp_guard.py) goes away at the end anyway.
tmp_path_retention_policy = none
tmp_path_retention_count = 0
