[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photobox-sync"
version = "0.9.1"
description = "Synchronisiert Fotobox-Aufnahmen (dslrBooth, LumaBooth, Photobox Booth, beliebige Ordner) mit der Photobox Gallery, einem NAS oder Picdrop — offline zuerst."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "paramiko>=3.4", "PyNaCl>=1.5", "psutil>=5.9", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
photobox-sync = "photobox_sync.__main__:main"

[tool.setuptools.packages.find]
include = ["photobox_sync*"]

[tool.setuptools.package-data]
photobox_sync = ["web/*"]
