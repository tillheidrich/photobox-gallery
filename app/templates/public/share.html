{% extends "layout_public.html" %}
{% block title %}{{ event.name }} – Sharepic{% endblock %}
{% block content %}
<div style="max-width:520px;margin:0 auto;padding:24px 18px 60px;text-align:center">
  <img src="/gallery/{{ event.slug }}/sharepic.png" alt="Sharepic {{ event.name }}" style="width:100%;height:auto;border-radius:18px;box-shadow:0 20px 50px -25px rgba(0,0,0,.5)" width="1080" height="1920">
  <div style="display:grid;gap:10px;margin-top:18px">
    <button class="btn btn--primary" style="justify-content:center;min-height:52px" onclick="sharePic()">{{ t('gallery.share') }}</button>
    <a class="btn btn--secondary" style="justify-content:center;min-height:52px" href="/gallery/{{ event.slug }}/sharepic.png?download=1">{{ t('session.download') }}</a>
    <a class="btn btn--ghost" style="justify-content:center" href="/gallery/{{ event.slug }}?src=sharepic">{{ t('session.to_gallery') }}</a>
  </div>
</div>
<script>
async function sharePic(){
  const url='/gallery/{{ event.slug }}/sharepic.png';
  try{
    const blob=await (await fetch(url)).blob();
    const file=new File([blob],'sharepic-{{ event.slug }}.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
    if(navigator.share){await navigator.share({url:location.origin+'/gallery/{{ event.slug }}'});return;}
  }catch(e){if(e.name==='AbortError')return;}
  location.href=url+'?download=1';
}
</script>
{% endblock %}
