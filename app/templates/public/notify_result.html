{% extends "layout_public.html" %}
{% block title %}{{ t('notify.title') }}{% endblock %}
{% block content %}
<div style="min-height:60vh; display:flex; align-items:center; justify-content:center; padding:var(--sp-8);">
  <div class="card" style="max-width:460px; width:100%; padding:var(--sp-10) var(--sp-8); text-align:center;">
    <div style="width:56px;height:56px;margin:0 auto var(--sp-5);border-radius:var(--r-xl);display:flex;align-items:center;justify-content:center;
                background:{% if success %}var(--color-primary-bg){% else %}var(--color-danger-bg){% endif %};
                color:{% if success %}var(--color-primary-text){% else %}var(--color-danger){% endif %}">
      {% if success %}
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      {% else %}
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      {% endif %}
    </div>
    <h1 style="font-size:var(--text-xl); font-weight:700; letter-spacing:-.02em; margin-bottom:var(--sp-2);">
      {% if success %}{{ t('notify.thanks') }}{% else %}{{ t('notify.oops') }}{% endif %}
    </h1>
    <p style="color:var(--color-text-2);">{{ message }}</p>
    <div style="margin-top:var(--sp-8);">
      <a href="{{ url_for('public.home') }}" class="btn btn--primary">{{ t('common.to_home') }}</a>
    </div>
  </div>
</div>
{% endblock %}
