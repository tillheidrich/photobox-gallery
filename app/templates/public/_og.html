{#- Link preview for chat apps (app/link_preview.py). ``og`` comes from
    link_meta(); what it may show was decided without the session. -#}
{% if og %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ g.homepage_headline or 'Photobox Gallery' }}">
  <meta property="og:title" content="{{ og.title }}">
  <meta property="og:description" content="{{ og.description }}">
  <meta property="og:url" content="{{ og.url }}">
  <meta property="og:image" content="{{ og.image }}">
  {% if og.image.startswith('https://') %}<meta property="og:image:secure_url" content="{{ og.image }}">{% endif %}
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="{{ og.width }}">
  <meta property="og:image:height" content="{{ og.height }}">
  <meta property="og:image:alt" content="{{ og.title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og.title }}">
  <meta name="twitter:description" content="{{ og.description }}">
  <meta name="twitter:image" content="{{ og.image }}">
{% endif %}
