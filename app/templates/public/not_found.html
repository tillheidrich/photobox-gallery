{% extends "layout_public.html" %}
{% block title %}{{ t('notfound.title') }}{% endblock %}
{% block head %}
<meta name="robots" content="noindex">
<style>
  .nf{max-width:560px;margin:0 auto;padding:14vh 20px 80px;min-height:62vh}
  .nf-code{font-size:.78rem;letter-spacing:.14em;color:var(--color-text-muted);margin:0 0 12px;font-variant-numeric:tabular-nums}
  .nf h1{font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.02em;line-height:1.12;margin:0 0 14px}
  .nf p{color:var(--color-text-2);line-height:1.6;margin:0 0 28px;max-width:44ch}
</style>
{% endblock %}
{% block content %}
<main class="nf">
  <p class="nf-code">404</p>
  <h1>{{ t('notfound.title') }}</h1>
  <p>{{ t('notfound.text') }}</p>
  <a class="btn btn--secondary" href="/">{{ t('notfound.home') }}</a>
</main>
{% endblock %}
