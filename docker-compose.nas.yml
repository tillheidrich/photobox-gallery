# Photobox Gallery on a NAS in the home network (Synology/QNAP Container
# Manager, any Docker host without a reverse proxy in front).
#
#   docker compose -f docker-compose.nas.yml up -d
#
# Differences to docker-compose.yml (the VPS variant behind Coolify/Traefik):
#   * the port is published on the LAN (all interfaces of the NAS),
#   * TRUST_PROXY stays 0 — nothing in front sets X-Forwarded-For, so the
#     gallery must not believe that header,
#   * BASE_URL is mandatory: reset mails, pairing codes and QR links are built
#     from it (the gallery refuses to build them from a request's Host header),
#   * data lives on a share of the NAS (bind mount), not in ./data,
#   * the container runs as the NAS user PUID:PGID, not as root.
# Step by step (German): docs/INSTALL-NAS.md
#
# Works on amd64 and arm64: python:3.12-slim is multi-arch, and every
# dependency in requirements.txt has wheels for both (or is pure Python).

services:
  web:
    build: .
    restart: unless-stopped
    user: "${PUID:-1026}:${PGID:-100}"
    # Published in the LAN on purpose: guests' phones and the booth reach the
    # gallery at http://<NAS>:5000. BIND_ADDR=127.0.0.1 keeps the port on the
    # NAS itself, for when its reverse proxy is the only way in (then, and
    # only then, TRUST_PROXY=1). See docs/INSTALL-NAS.md.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-5000}:5000"
    volumes:
      - "${NAS_DATA_DIR:?Set NAS_DATA_DIR to a folder on the NAS share, e.g. /volume1/docker/photobox/data}:/data"
    environment:
      - DATA_DIR=/data
      - HOME=/tmp
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to 32+ random characters}
      - BASE_URL=${BASE_URL:?Set BASE_URL, e.g. http://192.168.1.20:5000 or https://fotos.example.de}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # Nothing in front of the container on a plain NAS install: keep 0.
      # Set 1 only if the NAS's own reverse proxy is the ONLY way in
      # (port 5000 not reachable directly), see docs/INSTALL-NAS.md.
      - TRUST_PROXY=${TRUST_PROXY:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# No separate pruner service here: the gallery starts its own daily
# maintenance run (backup, retention, offload; PHOTOBOX_MAINTENANCE, default
# on, see docs/MAINTENANCE.md). One container is easier to look after on a NAS.
